name: ExamProctor CI/CD Pipeline

on:
  push:
    branches: [ main, master, release/* ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "Deployment Environment Target"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

jobs:
  # ── 1. Quality & Linting ────────────────────────────────────────────────────
  lint-and-validate:
    name: Code Quality & Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black

      - name: Python Bytecode Compilation Check
        run: python -m compileall -q .

      - name: Run Syntax & Critical Lint Check
        run: |
          # Stop build on syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv,.venv,__pycache__

  # ── 2. Security Audit ───────────────────────────────────────────────────────
  security-audit:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies & Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pip-audit

      - name: Static Security Analysis (Bandit)
        run: |
          bandit -r . -x ./venv,./.venv,./testing -ll -ii --format screen || true

      - name: Dependency Vulnerability Check
        run: |
          pip-audit --desc on || true

  # ── 3. Test Suite Execution ─────────────────────────────────────────────────
  test-suite:
    name: Unit & Regression Test Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: exam_proctor_staging
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENVIRONMENT: testing
      TESTING: "true"
      SECRET_KEY: ci-cd-testing-cryptographically-secure-key-min-32-chars
      DATABASE_URL: postgresql://postgres:password123@localhost:5432/exam_proctor_staging
      REDIS_URL: redis://localhost:6379/0
      MOCK_EMAIL: "true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Full Unittest Discovery (All Phases 0 - 12)
        run: |
          python -m unittest discover -s testing -p "test_*.py" -v

  # ── 4. Docker Build & Container Verification ────────────────────────────────
  docker-build-verify:
    name: Docker Build & Liveness Verification
    runs-on: ubuntu-latest
    needs: [lint-and-validate, test-suite]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          tags: examproctor:ci-test
          load: true

      - name: Run Container & Verify Health Endpoint
        run: |
          docker run -d --name test_app -p 10000:10000 \
            -e ENVIRONMENT=production \
            -e SECRET_KEY="a-very-long-production-grade-secret-key-32-chars-long" \
            -e DATABASE_URL="sqlite:///:memory:" \
            examproctor:ci-test

          echo "Waiting for container startup..."
          sleep 10

          docker ps
          curl -f http://localhost:10000/health || (docker logs test_app && exit 1)
          docker stop test_app

  # ── 5. Production Approval & Deployment Gate ────────────────────────────────
  deploy-production:
    name: Production Deployment Gate
    runs-on: ubuntu-latest
    needs: [docker-build-verify]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_target == 'production'
    environment:
      name: production
      url: https://examproctor.yourdomain.com
    steps:
      - name: Deployment Notice
        run: |
          echo "Production deployment gated by required environment approval."
          echo "Operator must verify backups before executing migrations."
