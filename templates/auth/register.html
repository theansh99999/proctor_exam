{% extends "base.html" %}
{% set hide_nav = True %}

{% block content %}
<div class="auth-container">
    <div class="col-md-5 col-lg-4 mt-5 mb-5">
        <div class="card glass-card p-4">
            <div class="text-center mb-4">
                <h2 class="fw-bold text-primary">Register</h2>
                <p class="text-muted">Create a student account to get started</p>
            </div>

            {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
            {% endif %}

            <form method="POST" action="/register">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <div class="mb-3">
                    <label class="form-label fw-medium">Full Name</label>
                    <input type="text" name="name" class="form-control" required placeholder="John Doe">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-medium">Email address</label>
                    <input type="email" name="email" class="form-control" required placeholder="name@example.com">
                </div>
                <!-- Role is always student for public registration. Teachers are created by admins. -->
                <input type="hidden" name="role" value="student">
                <div class="mb-4">
                    <label class="form-label fw-medium">Password <small class="text-muted">(min. 8 characters)</small></label>
                    <input type="password" name="password" class="form-control" required placeholder="••••••••" minlength="8">
                </div>
                <button type="submit" class="btn btn-primary-custom w-100">Register as Student</button>
            </form>
            <div class="text-center mt-4">
                <span class="text-muted">Already have an account? <a href="/login" class="text-decoration-none">Login</a></span>
            </div>
        </div>
    </div>
</div>
{% endblock %}
